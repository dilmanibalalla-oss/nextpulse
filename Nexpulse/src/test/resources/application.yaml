spring:
  datasource:
    url: jdbc:h2:mem:nexpulse-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: sa
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: false

nexpulse:
  jwt:
    secret: nexpulse-test-jwt-secret-do-not-use-in-prod
    expiration: PT15M
